description: Orchard Labs Inc. is a Toronto-based e-commerce company, founded in 2013, that buys, refurbishes,
  and resells pre-owned and certified-refurbished smartphones, tablets, and accessories across North America.
  Through its consumer website and mobile app, Orchard lets people test, price, and sell their used iPhones and
  Android devices, and buy thoroughly tested refurbished devices backed by a 90-day no-questions-asked warranty
  and carbon-neutral shipping. It is a consumer retail brand with no public API, developer portal, or SDKs.
  Backed by 500 Global.
